# yefeng8771 fork 新增：每日从上游 dengmeiluan/ticket-monitoring 自动同步
# 快照式同步：上游会改写 main 历史（force-push，见 2026-10-19 ee5afc73 孤儿快照），
# merge 式同步遇到无共同祖先就会失败；快照式每次用上游当前树整体替换，
# 仅叠回 fork 自有文件，线性提交，永不失败。
name: upstream-sync

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 10:00 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 快照同步上游
        run: |
          set -e
          # fork 自有文件：同步时保留，不被上游树覆盖
          # （Dockerfile/.dockerignore 是 fork 定制版，覆盖上游同名文件是刻意的）
          KEEP=(
            .github/workflows/upstream-sync.yml
            .github/workflows/docker-build.yml
            Dockerfile
            .dockerignore
            docker/entrypoint.sh
            docker/README.md
          )
          git remote add upstream https://github.com/dengmeiluan/ticket-monitoring.git || true
          git fetch upstream main
          before="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"
          # 整体替换为上游当前树（上游改写历史也不怕），再把自有文件叠回来
          git read-tree --reset -u upstream/main
          git checkout "$before" -- "${KEEP[@]}"
          git add -A
          if git diff --cached --quiet; then
            echo "已是最新，无需同步"
          else
            git commit -m "chore(sync): 快照同步 dengmeiluan/ticket-monitoring@${upstream_head:0:7}"
            git push origin main
            echo "已同步到上游 ${upstream_head:0:7}"
          fi
