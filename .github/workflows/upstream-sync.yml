# yefeng8771 fork 新增：每日从上游 dengmeiluan/ticket-monitoring 自动同步
# 快照式同步：上游会改写 main 历史（force-push，见 2026-10-19 ee5afc73 孤儿快照），
# merge 式同步遇到无共同祖先就会失败；快照式每次用上游当前树整体替换，
# 仅叠回 fork 自有文件，线性提交，永不失败。
name: upstream-sync

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 10:00 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 快照同步上游
        run: |
          set -e
          # fork 自有文件：同步时保留，不被上游树覆盖
          # （Dockerfile/.dockerignore 是 fork 定制版，覆盖上游同名文件是刻意的）
          KEEP=(
            .github/workflows/upstream-sync.yml
            .github/workflows/docker-build.yml
            Dockerfile
            .dockerignore
            docker/entrypoint.sh
            docker/README.md
          )
          git remote add upstream https://github.com/dengmeiluan/ticket-monitoring.git || true
          git fetch upstream main
          before="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"
          # 整体替换为上游当前树（上游改写历史也不怕），再把自有文件叠回来
          git read-tree --reset -u upstream/main
          git checkout "$before" -- "${KEEP[@]}"
          # .github/workflows 整体冻结为 fork 当前版本：GITHUB_TOKEN 的权限模型里
          # 没有推送 workflow 文件变更这一项，带上游 workflow 变更的提交会被 GitHub
          # 拒绝（2026-10-21 run 39574197535 实测）。上游自带 CI 在 fork 里本来就
          # 跑不过，冻结该目录不影响 fork 自有 docker-build 与代码同步。
          git checkout "$before" -- .github/workflows
          git ls-tree -r --name-only upstream/main -- .github/workflows | while read -r f; do
            git cat-file -e "${before}:${f}" 2>/dev/null || rm -f "$f"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "已是最新，无需同步"
          else
            git commit -m "chore(sync): 快照同步 dengmeiluan/ticket-monitoring@${upstream_head:0:7}"
            git push origin HEAD:main
            echo "已同步到上游 ${upstream_head:0:7}"
          fi
