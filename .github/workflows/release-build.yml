name: release-build

# 三平台发行包构建（R50 跨平台）：手动触发——恒态纪律下 tag 恒 v1.0
# force 重指，不挂 tag 触发避免每次重指都烧三台 runner。产物=
# dist_package 同构 zip（包根=TicketMonitor 可执行+_internal/），人审
# 后经 API 挂到 v1.0 Release（1 Release·3 资产角）。
#
# chromium 不入包：应用首启自装内核（main.py「检查/安装 chromium 内
# 核」跨平台路径），collect_all('playwright') 只捆驱动不捆浏览器。
# WinToast 通道 os.name 门控（notifier.py），非 Windows 启停安全。

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ticket-monitoring-win64.zip
          - os: ubuntu-latest
            asset: ticket-monitoring-linux-x64.zip
          - os: macos-latest
            asset: ticket-monitoring-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller 打包（TicketMonitor.spec 三平台同构）
        run: pyinstaller TicketMonitor.spec --noconfirm
      - name: 冒烟（可执行 --version）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/TicketMonitor/TicketMonitor.exe --version
          else
            chmod +x ./dist/TicketMonitor/TicketMonitor
            ./dist/TicketMonitor/TicketMonitor --version
          fi
      - name: 打 zip（包根=可执行+_internal，与 v1.0-win64 资产同构）+ sha256
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import hashlib, os, shutil, zipfile
          os.makedirs("dist_package", exist_ok=True)
          asset = "${{ matrix.asset }}"
          base = os.path.join("dist_package", asset[:-4])
          shutil.make_archive(base, "zip", os.path.join("dist", "TicketMonitor"))
          z = zipfile.ZipFile(base + ".zip")
          ns = z.namelist()
          print("zip 条目:", len(ns), "| 头三:", ns[:3])
          digest = hashlib.sha256(open(base + ".zip", "rb").read()).hexdigest()
          print("sha256:", digest)
          open(base + ".sha256", "w").write(digest + "  " + asset + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist_package/${{ matrix.asset }}
          if-no-files-found: error
