# yefeng8771 fork 新增：Docker 镜像自动构建 → ghcr.io/yefeng8771/ticket-monitoring
name: docker-build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - requirements.txt
      - main.py
      - webui.py
      - core/**
      - crawlers/**
  schedule:
    # 每天 11:00 CST，紧随 upstream-sync(10:00 CST)；若上游有更新则打出新镜像
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 当前提交已打过镜像则跳过（定时触发去重）
        id: skip
        run: |
          TAG="ghcr.io/yefeng8771/ticket-monitoring:sha-$(git rev-parse --short HEAD)"
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "镜像 $TAG 已存在，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yefeng8771/ticket-monitoring
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
